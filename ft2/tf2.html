        // ============ SHOW DETAILS ============
        function showDetails(character) {
            if (!characterData[character]) return;

            const { basic, special, melee } = characterData[character];
            const detailsDiv = document.getElementById('character-info');
            const panelTitle = document.getElementById('panel-title');

            panelTitle.textContent = character.charAt(0).toUpperCase() + character.slice(1);

            let html = '';

            // Basic upgrades
            html += `
                <div class="upgrade-section">
                    <h3>Base Upgrades</h3>
                    <div class="upgrade-items">
                        ${basic.map(u => `
                            <div class="upgrade-item">
                                <img src="${u.img}" alt="Base upgrade">
                                <p>${u.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Special weapon upgrades
            Object.entries(special).forEach(([weapon, upgrades]) => {
                html += `
                    <div class="upgrade-section">
                        <h3>Primary — <span class="weapon-tag">${weapon}</span></h3>
                        <div class="upgrade-items">
                            ${upgrades.map(u => `
                                <div class="upgrade-item">
                                    <img src="${u.img}" alt="${weapon} upgrade">
                                    <p>${u.description}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            // Melee weapon upgrades
            Object.entries(melee).forEach(([weapon, upgrades]) => {
                html += `
                    <div class="upgrade-section">
                        <h3>Melee — <span class="weapon-tag">${weapon}</span></h3>
                        <div class="upgrade-items">
                            ${upgrades.map(u => `
                                <div class="upgrade-item">
                                    <img src="${u.img}" alt="${weapon} upgrade">
                                    <p>${u.description}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            detailsDiv.innerHTML = html;

            const panel = document.getElementById('details-panel');
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function hideDetails() {
            document.getElementById('details-panel').classList.remove('visible');
        }
