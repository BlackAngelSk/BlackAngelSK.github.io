<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Studio</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#14171d; --panel2:#1a1e26; --line:#262c38;
    --fg:#dbe2ea; --dim:#8b95a5; --accent:#ffb454; --accent-dim:#8a5f22;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex; align-items:center; gap:14px;
    padding:10px 14px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .logo{font-weight:700; letter-spacing:.5px; font-size:14px}
  .logo span{color:var(--accent)}
  .badge{
    font-size:11px; color:var(--dim); border:1px solid var(--line);
    border-radius:999px; padding:2px 9px;
  }
  header .spacer{flex:1}
  .status{font-family:ui-monospace,"DejaVu Sans Mono",monospace; font-size:11px; color:var(--dim); white-space:nowrap}
  .status b{color:var(--fg); font-weight:500}

  main{flex:1; display:grid; grid-template-columns:52px 1fr 268px; min-height:0}

  /* ---------- toolbar ---------- */
  #toolbar{
    border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0;
  }
  .tool{
    width:36px; height:36px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--dim); font-size:16px; cursor:pointer;
    display:grid; place-items:center; position:relative;
  }
  .tool:hover{background:var(--panel2); color:var(--fg)}
  .tool.active{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700}
  .tool[data-tip]:hover::after{
    content:attr(data-tip); position:absolute; left:44px; top:50%; transform:translateY(-50%);
    background:#000; color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:3px 8px; font-size:11px; white-space:nowrap; z-index:30; pointer-events:none;
  }
  .sep{width:24px; height:1px; background:var(--line); margin:4px 0}

  /* ---------- stage ---------- */
  #stage{overflow:auto; display:grid; place-items:center; padding:18px; background:
    radial-gradient(circle at 50% 0%, #14181f 0%, #0b0d11 70%);}
  #wrap{position:relative; box-shadow:0 18px 50px rgba(0,0,0,.55); border-radius:4px}
  canvas{display:block; touch-action:none; cursor:crosshair; border-radius:4px}
  #cur,#hov{position:absolute; top:0; left:0; pointer-events:none; border-radius:2px; will-change:transform}
  #cur{outline:1px solid var(--accent); background:rgba(255,180,84,.10); animation:blink 1.1s steps(1) infinite}
  #hov{outline:1px solid rgba(255,255,255,.22)}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.25}}

  /* ---------- right panel ---------- */
  #panel{
    border-left:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:14px;
  }
  .grp>label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--dim); margin-bottom:6px}
  .row{display:flex; gap:6px; align-items:center}
  .swatches{display:grid; grid-template-columns:repeat(8,1fr); gap:4px}
  .sw{aspect-ratio:1; border-radius:4px; border:1px solid rgba(255,255,255,.15); cursor:pointer; padding:0}
  .sw.on{outline:2px solid var(--accent); outline-offset:1px}
  .chars{display:flex; flex-wrap:wrap; gap:3px}
  .ch{
    width:22px; height:24px; border-radius:4px; border:1px solid var(--line);
    background:var(--panel2); color:var(--fg); cursor:pointer; padding:0;
    font-family:ui-monospace,"DejaVu Sans Mono",monospace; font-size:12px;
  }
  .ch:hover{border-color:var(--dim)}
  .ch.on{background:var(--accent); color:#1a1206; border-color:var(--accent)}
  input[type=text],input[type=number]{
    background:#0e1116; border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:5px 7px; font-family:inherit; font-size:12px; width:100%;
  }
  input[type=number]{width:60px}
  input[type=text]:focus,input[type=number]:focus,button:focus-visible{outline:1px solid var(--accent); outline-offset:1px}
  input[type=color]{width:30px; height:26px; padding:0; border:1px solid var(--line);
    background:#0e1116; border-radius:6px; cursor:pointer}
  button.btn{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; cursor:pointer; font:inherit; font-size:12px;
  }
  button.btn:hover{border-color:var(--dim); background:#222833}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:600}
  button.btn.wide{flex:1}
  .toggle{display:flex; align-items:center; gap:8px; color:var(--fg); font-size:12px; cursor:pointer; user-select:none}
  .toggle input{accent-color:var(--accent); width:14px; height:14px}
  .hint{font-size:11px; color:var(--dim); line-height:1.5}
  kbd{background:#0e1116; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:4px; padding:0 4px; font:11px ui-monospace,monospace; color:var(--dim)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:6px}

  #toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px);
    background:var(--accent); color:#1a1206; font-weight:600; font-size:12px;
    padding:7px 14px; border-radius:8px; opacity:0; transition:.18s; pointer-events:none; z-index:50;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}
  @media (max-width:820px){ main{grid-template-columns:46px 1fr} #panel{display:none} }
</style>
</head>
<body>

<header>
  <div class="logo">ASCII <span>Studio</span></div>
  <div class="badge" id="toolBadge">pencil</div>
  <div class="spacer"></div>
  <div class="status" id="status">80 × 30</div>
</header>

<main>
  <aside id="toolbar">
    <button class="tool active" data-tool="pencil" data-tip="Pencil (1)">✎</button>
    <button class="tool" data-tool="eraser" data-tip="Eraser (2)">⌫</button>
    <button class="tool" data-tool="text"   data-tip="Type (3)">T</button>
    <div class="sep"></div>
    <button class="tool" data-tool="line"   data-tip="Line (4)">╱</button>
    <button class="tool" data-tool="rect"   data-tip="Rectangle (5)">▭</button>
    <button class="tool" data-tool="ellipse" data-tip="Ellipse (6)">◯</button>
    <div class="sep"></div>
    <button class="tool" data-tool="fill"   data-tip="Flood fill (7)">▩</button>
    <button class="tool" data-tool="pick"   data-tip="Pick char (8)">⌖</button>
    <div class="sep"></div>
    <button class="tool" id="undoBtn" data-tip="Undo (Ctrl+Z)">↺</button>
    <button class="tool" id="redoBtn" data-tip="Redo (Ctrl+Y)">↻</button>
  </aside>

  <section id="stage">
    <div id="wrap">
      <canvas id="art"></canvas>
      <div id="cur"></div>
      <div id="hov"></div>
    </div>
  </section>

  <aside id="panel">
    <div class="grp">
      <label>Brush character</label>
      <div class="row" style="margin-bottom:6px">
        <input type="text" id="charInput" maxlength="1" value="#" style="width:44px;text-align:center">
        <span class="hint">any single char</span>
      </div>
      <div class="chars" id="charPalette"></div>
    </div>

    <div class="grp">
      <label>Colour</label>
      <div class="swatches" id="swatches" style="margin-bottom:6px"></div>
      <div class="row">
        <input type="color" id="colorInput" value="#ffb454">
        <label class="toggle"><input type="checkbox" id="useColor"> per-cell colour</label>
      </div>
    </div>

    <div class="grp">
      <label>Canvas</label>
      <div class="row" style="margin-bottom:6px">
        <input type="number" id="gridW" min="4" max="400" value="80">
        <span class="hint">×</span>
        <input type="number" id="gridH" min="2" max="200" value="30">
        <button class="btn" id="resizeBtn">resize</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <span class="hint" style="width:52px">zoom</span>
        <input type="range" id="zoom" min="8" max="28" value="16" style="width:100%;accent-color:var(--accent)">
      </div>
      <label class="toggle" style="margin-bottom:6px"><input type="checkbox" id="gridToggle" checked> show grid</label>
      <label class="toggle"><input type="checkbox" id="fillToggle"> filled shapes</label>
    </div>

    <div class="grp">
      <label>File</label>
      <div class="grid2">
        <button class="btn" id="newBtn">New</button>
        <button class="btn" id="sampleBtn">Sample</button>
        <button class="btn" id="importBtn">Import .txt</button>
        <button class="btn" id="saveBtn">Save .json</button>
        <button class="btn" id="loadBtn">Open .json</button>
        <button class="btn" id="pngBtn">PNG</button>
        <button class="btn" id="txtBtn">Copy text</button>
        <button class="btn" id="ansBtn">ANSI</button>
      </div>
    </div>

    <div class="grp">
      <label>Keys</label>
      <div class="hint">
        type to draw · arrows move · <kbd>Shift</kbd>+click line ·
        <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>Y</kbd> redo ·
        <kbd>1</kbd>–<kbd>8</kbd> tools
      </div>
    </div>
  </aside>
</main>

<input type="file" id="fileInput" accept=".txt,.json,text/plain,application/json" hidden>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ============================== state ============================== */
const FONT_STACK = "'JetBrains Mono','Fira Code','Cascadia Mono','DejaVu Sans Mono',ui-monospace,monospace";
const BG = '#0b0d11', INK = '#dbe2ea', PREVIEW = '#ffb454', GRID = 'rgba(255,255,255,.045)';
const PAD = 14;

let W = 80, H = 30;
let chars = new Array(W * H).fill(' ');
let colors = new Array(W * H).fill(null);
let fontSize = 15, cellW = 9, cellH = 19;

const S = {
  tool: 'pencil', ch: '#', color: '#ffb454', useColor: false,
  grid: true, filled: false
};

let cursor = { x: 0, y: 0 }, hover = null;
let dragging = false, lastCell = null, shapeStart = null, anchor = null;
let preview = null;              // Map<index, char> for shape rubber-band
let undoStack = [], redoStack = [];

const cvs = document.getElementById('art');
const ctx = cvs.getContext('2d');
const wrap = document.getElementById('wrap');
const curEl = document.getElementById('cur');
const hovEl = document.getElementById('hov');

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const idx = (x, y) => y * W + x;

/* ============================== metrics / layout ============================== */
function measure(g = ctx) {
  g.font = `${fontSize}px ${FONT_STACK}`;
  cellW = g.measureText('M').width || fontSize * 0.6;
  cellH = Math.round(fontSize * 1.28);
}

function layout() {
  measure();
  const dpr = window.devicePixelRatio || 1;
  const cssW = Math.ceil(W * cellW) + PAD * 2;
  const cssH = H * cellH + PAD * 2;
  cvs.width = Math.round(cssW * dpr);
  cvs.height = Math.round(cssH * dpr);
  cvs.style.width = cssW + 'px';
  cvs.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
  placeOverlays();
  updateStatus();
}

/* ============================== rendering ============================== */
function render(g, opts = {}) {
  const scale = opts.scale || 1;
  const pad = opts.pad === undefined ? PAD : opts.pad;
  const gridOn = opts.grid !== false;
  const prev = opts.preview || null;
  const cw = opts.cw || cellW;
  const ch = opts.chh || cellH;

  g.save();
  g.fillStyle = opts.bg || BG;
  g.fillRect(0, 0, W * cw + pad * 2, H * ch + pad * 2);
  g.translate(pad, pad);

  if (gridOn && cw >= 7) {
    g.strokeStyle = GRID;
    g.lineWidth = 1;
    g.beginPath();
    for (let x = 1; x < W; x++) { g.moveTo(Math.round(x * cw) + .5, 0); g.lineTo(Math.round(x * cw) + .5, H * ch); }
    for (let y = 1; y < H; y++) { g.moveTo(0, Math.round(y * ch) + .5); g.lineTo(W * cw, Math.round(y * ch) + .5); }
    g.stroke();
  }

  g.font = `${fontSize * scale}px ${FONT_STACK}`;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  const baseY = Math.round(ch * 0.78);
  const ink = S.useColor ? null : INK;

  for (let y = 0; y < H; y++) {
    let run = '', runColor = null, runX = 0, flushing = false;
    const flush = () => {
      if (!run) return;
      g.fillStyle = runColor;
      g.fillText(run, runX * cw, y * ch + baseY);
      run = ''; flushing = false;
    };
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      let c = chars[i] || ' ';
      let col = S.useColor ? (colors[i] || INK) : INK;
      if (prev && prev.has(i)) { c = prev.get(i); col = PREVIEW; }
      if (run && col !== runColor) flush();
      if (!run) { runX = x; runColor = col; }
      run += c;
    }
    flush();
  }
  g.restore();
}

function draw() { render(ctx, { grid: S.grid, preview }); scheduleSave(); }

/* ---------- autosave ---------- */
const SAVE_KEY = 'ascii-studio:v1';
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 900);
}
function saveNow() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      w: W, h: H, rows: toText(false).split('\n'),
      colors: Array.from({ length: H }, (_, y) =>
        Array.from({ length: W }, (_, x) => colors[idx(x, y)] || null)),
      fontSize, useColor: S.useColor
    }));
  } catch (e) { /* quota / private mode: ignore */ }
}
function restore() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.rows) || !d.rows.length) return false;
    loadJSON(d);
    return true;
  } catch { return false; }
}

function placeOverlays() {
  const put = (el, p) => {
    if (!p) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.width = Math.floor(cellW) + 'px';
    el.style.height = cellH + 'px';
    el.style.transform = `translate(${PAD + p.x * cellW}px, ${PAD + p.y * cellH}px)`;
  };
  put(curEl, cursor);
  put(hovEl, hover && !(hover.x === cursor.x && hover.y === cursor.y) ? hover : null);
}

function updateStatus() {
  $('status').innerHTML =
    `<b>${W}</b> × <b>${H}</b> &nbsp;·&nbsp; cursor <b>${cursor.x},${cursor.y}</b>` +
    ` &nbsp;·&nbsp; <b>${escapeHtml(S.ch === ' ' ? 'space' : S.ch)}</b>`;
}
const escapeHtml = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* ============================== history ============================== */
function snapshot() { return { chars: chars.slice(), colors: colors.slice(), W, H }; }
function pushHistory() {
  undoStack.push(snapshot());
  if (undoStack.length > 120) undoStack.shift();
  redoStack.length = 0;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  const s = undoStack.pop();
  chars = s.chars; colors = s.colors;
  if (s.W !== W || s.H !== H) { W = s.W; H = s.H; syncSizeInputs(); layout(); }
  else draw();
  toast('undo');
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  const s = redoStack.pop();
  chars = s.chars; colors = s.colors;
  if (s.W !== W || s.H !== H) { W = s.W; H = s.H; syncSizeInputs(); layout(); }
  else draw();
  toast('redo');
}

/* ============================== painting primitives ============================== */
function setCell(x, y, ch, col) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = idx(x, y);
  chars[i] = ch;
  colors[i] = col || null;
}
function paint(x, y) {
  setCell(x, y, S.tool === 'eraser' ? ' ' : S.ch, S.useColor ? S.color : null);
}
function linePoints(a, b, out) {
  let x0 = a.x, y0 = a.y, x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let guard = 0; guard < 5000; guard++) {
    out.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return out;
}

function shapePoints(a, b) {
  const pts = [];
  const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
  const y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
  if (S.tool === 'line') { linePoints(a, b, pts); return pts; }
  if (S.tool === 'rect') {
    if (S.filled) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) pts.push([x, y]); }
    else {
      for (let x = x0; x <= x1; x++) { pts.push([x, y0]); pts.push([x, y1]); }
      for (let y = y0; y <= y1; y++) { pts.push([x0, y]); pts.push([x1, y]); }
    }
    return pts;
  }
  /* ellipse */
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const rx = Math.abs(b.x - a.x) / 2, ry = Math.abs(b.y - a.y) / 2;
  if (rx < .5 || ry < .5) { linePoints(a, b, pts); return pts; }
  const inside = (x, y) => {
    const u = (x - cx) / (rx + .45), v = (y - cy) / (ry + .45);
    return u * u + v * v <= 1;
  };
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!inside(x, y)) continue;
    if (S.filled || !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1))
      pts.push([x, y]);
  }
  return pts;
}

function flood(x, y) {
  const target = chars[idx(x, y)];
  const ch = S.tool === 'eraser' ? ' ' : S.ch;
  if (target === ch && !S.useColor) return;
  const seen = new Uint8Array(W * H);
  const stack = [[x, y]];
  let n = 0;
  while (stack.length && n < W * H * 4) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
    const i = idx(cx, cy);
    if (seen[i]) continue;
    seen[i] = 1;
    if (chars[i] !== target) continue;
    setCell(cx, cy, ch, S.useColor ? S.color : null);
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    n++;
  }
}

/* ============================== input ============================== */
function cellFromEvent(e) {
  const r = cvs.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left - PAD) / cellW),
    y: Math.floor((e.clientY - r.top - PAD) / cellH)
  };
}
const inBounds = c => c.x >= 0 && c.y >= 0 && c.x < W && c.y < H;

cvs.addEventListener('contextmenu', e => e.preventDefault());

cvs.addEventListener('pointerdown', e => {
  const c = cellFromEvent(e);
  if (!inBounds(c)) return;
  cvs.setPointerCapture(e.pointerId);
  if (e.button === 2) {                     // right-click erases, whatever the tool
    pushHistory();
    const pts = [];
    linePoints(anchor || c, c, pts);
    for (const [x, y] of pts) setCell(x, y, ' ', null);
    anchor = { ...c }; dragging = true; lastCell = { ...c }; S._rightErase = true;
    draw(); return;
  }
  cursor = { ...c };
  placeOverlays();

  if (e.shiftKey && anchor) {                       // straight line from last point
    pushHistory();
    const pts = [];
    linePoints(anchor, c, pts);
    for (const [x, y] of pts) paint(x, y);
    anchor = { ...c };
    draw(); updateStatus();
    return;
  }

  switch (S.tool) {
    case 'pick': {
      const i = idx(c.x, c.y);
      if (chars[i] !== ' ') S.ch = chars[i];
      if (colors[i]) { S.color = colors[i]; S.useColor = true; }
      syncCharInput(); syncColorUI(); setTool('pencil');
      toast('picked ' + (S.ch === ' ' ? 'space' : S.ch));
      break;
    }
    case 'fill': pushHistory(); flood(c.x, c.y); draw(); anchor = { ...c }; break;
    case 'text': anchor = { ...c }; updateStatus(); break;
    case 'line': case 'rect': case 'ellipse':
      pushHistory(); dragging = true; shapeStart = { ...c }; lastCell = { ...c }; break;
    default:
      pushHistory(); dragging = true; lastCell = { ...c }; paint(c.x, c.y); draw();
  }
  anchor = { ...c };
});

cvs.addEventListener('pointermove', e => {
  const c = cellFromEvent(e);
  hover = inBounds(c) ? c : null;
  if (dragging && inBounds(c)) {
    cursor = { ...c };
    if (S._rightErase) {
      const pts = [];
      linePoints(lastCell, c, pts);
      for (const [x, y] of pts) setCell(x, y, ' ', null);
      lastCell = { ...c };
      draw();
    } else if (S.tool === 'pencil' || S.tool === 'eraser') {
      const pts = [];
      linePoints(lastCell, c, pts);
      for (const [x, y] of pts) paint(x, y);
      lastCell = { ...c };
      draw();
    } else {
      preview = new Map();
      const pts = shapePoints(shapeStart, c);
      const glyph = S.tool === 'eraser' ? ' ' : S.ch;
      for (const [x, y] of pts) preview.set(idx(x, y), glyph);
      draw();
    }
  }
  placeOverlays(); updateStatus();
});

cvs.addEventListener('pointerleave', () => { hover = null; placeOverlays(); });

function endStroke(e) {
  if (!dragging) return;
  dragging = false;
  if (preview) {
    const col = S.useColor ? S.color : null;
    for (const [i, ch] of preview) { chars[i] = ch; colors[i] = col; }
    preview = null;
  }
  lastCell = null; shapeStart = null; S._rightErase = false;
  draw();
}
cvs.addEventListener('pointerup', endStroke);
cvs.addEventListener('pointercancel', endStroke);

/* ============================== keyboard ============================== */
/* digits only: letters must stay free for drawing */
const TOOL_KEYS = { '1': 'pencil', '2': 'eraser', '3': 'text', '4': 'line', '5': 'rect', '6': 'ellipse', '7': 'fill', '8': 'pick' };

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }

  switch (e.key) {
    case 'ArrowLeft':  cursor.x = clamp(cursor.x - 1, 0, W - 1); break;
    case 'ArrowRight': cursor.x = clamp(cursor.x + 1, 0, W - 1); break;
    case 'ArrowUp':    cursor.y = clamp(cursor.y - 1, 0, H - 1); break;
    case 'ArrowDown':  cursor.y = clamp(cursor.y + 1, 0, H - 1); break;
    case 'Home':       cursor.x = 0; break;
    case 'End':        cursor.x = W - 1; break;
    case 'Enter':      cursor.y = clamp(cursor.y + 1, 0, H - 1); cursor.x = 0; break;
    case 'Backspace':
      e.preventDefault();
      pushHistory();
      if (cursor.x > 0) cursor.x--;
      setCell(cursor.x, cursor.y, ' ', null);
      draw(); break;
    case 'Delete':
      pushHistory(); setCell(cursor.x, cursor.y, ' ', null); draw(); break;
    case 'Escape':
      if (preview) { preview = null; dragging = false; draw(); }
      break;
    default:
      if (mod || e.altKey) return;
      if (e.key.length === 1) {
        e.preventDefault();
        pushHistory();
        setCell(cursor.x, cursor.y, e.key, S.useColor ? S.color : null);
        S.ch = e.key; syncCharInput();
        cursor.x++;
        if (cursor.x >= W) { cursor.x = 0; cursor.y = clamp(cursor.y + 1, 0, H - 1); }
        draw();
      } else return;
  }
  placeOverlays(); updateStatus();
});

/* tool hotkeys (only when no modifier, and not a printable brush char conflict) */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.shiftKey) return;
  const tool = TOOL_KEYS[e.key];
  if (tool) setTool(tool);
});

/* ============================== UI wiring ============================== */
function setTool(name) {
  S.tool = name;
  document.querySelectorAll('.tool[data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === name));
  $('toolBadge').textContent = name;
  cvs.style.cursor = name === 'pick' ? 'copy' : name === 'text' ? 'text' : 'crosshair';
}

document.querySelectorAll('.tool[data-tool]').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool)));
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);

/* character palette */
const PALETTES = [
  ['#', '@', '%', '*', '+', '=', '-', ':', '.', "'", '`', '^', '~', '_', '|', '/', '\\', '<', '>', '(', ')', '[', ']', '{', '}', '$', '&', '?', '!', '"', ',', ';'],
  ['░', '▒', '▓', '█', '▄', '▀', '▌', '▐', '■', '□', '▪', '▫', '●', '○', '◘', '◙'],
  ['─', '│', '┌', '┐', '└', '┘', '├', '┤', '┬', '┴', '┼', '═', '║', '╔', '╗', '╚', '╝', '╠', '╣', '╦', '╩', '╬'],
  ['←', '→', '↑', '↓', '↔', '↕', '★', '☆', '✦', '✧', '◆', '◇', '▲', '▼', '◄', '►', '♦', '♠', '♣', '♥', '♪', '☺', '☻', '⌂']
];
const paletteEl = $('charPalette');
PALETTES.flat().forEach(ch => {
  const b = document.createElement('button');
  b.className = 'ch' + (ch === S.ch ? ' on' : '');
  b.textContent = ch;
  b.title = ch;
  b.addEventListener('click', () => { S.ch = ch; syncCharInput(); markPalette(); });
  paletteEl.appendChild(b);
});
function markPalette() {
  [...paletteEl.children].forEach(b => b.classList.toggle('on', b.textContent === S.ch));
}
function syncCharInput() { $('charInput').value = S.ch; markPalette(); updateStatus(); }
$('charInput').addEventListener('input', e => {
  const v = e.target.value;
  if (v.length) { S.ch = v[v.length - 1]; markPalette(); updateStatus(); }
});

/* colours */
const SWATCHES = ['#ffffff', '#dbe2ea', '#8b95a5', '#ff5c5c', '#ff9f43', '#ffd93d', '#a3e635',
                  '#34d399', '#22d3ee', '#60a5fa', '#a78bfa', '#f472b6', '#ffb454', '#94a3b8'];
const swEl = $('swatches');
SWATCHES.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c; b.title = c;
  b.addEventListener('click', () => { S.color = c; $('colorInput').value = c; markSwatches(); S.useColor = true; $('useColor').checked = true; });
  swEl.appendChild(b);
});
function markSwatches() { [...swEl.children].forEach(b => b.classList.toggle('on', b.style.background === hexToRgbStr(S.color))); }
$('colorInput').addEventListener('input', e => { S.color = e.target.value; markSwatches(); });
$('useColor').addEventListener('change', e => { S.useColor = e.target.checked; draw(); });
function syncColorUI() {
  $('colorInput').value = S.color;
  $('useColor').checked = S.useColor;
  markSwatches();
}
function hexToRgbStr(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255})`;
}

/* canvas size + zoom */
function syncSizeInputs() { $('gridW').value = W; $('gridH').value = H; }
$('resizeBtn').addEventListener('click', () => {
  const nw = clamp(parseInt($('gridW').value) || W, 4, 400);
  const nh = clamp(parseInt($('gridH').value) || H, 2, 200);
  if (nw === W && nh === H) return;
  pushHistory();
  const nextChars = new Array(nw * nh).fill(' ');
  const nextColors = new Array(nw * nh).fill(null);
  for (let y = 0; y < Math.min(H, nh); y++)
    for (let x = 0; x < Math.min(W, nw); x++) {
      nextChars[y * nw + x] = chars[idx(x, y)];
      nextColors[y * nw + x] = colors[idx(x, y)];
    }
  W = nw; H = nh; chars = nextChars; colors = nextColors;
  cursor = { x: clamp(cursor.x, 0, W - 1), y: clamp(cursor.y, 0, H - 1) };
  syncSizeInputs(); layout(); toast(`canvas ${W} × ${H}`);
});
$('zoom').addEventListener('input', e => {
  fontSize = parseInt(e.target.value);
  layout();
});
$('gridToggle').addEventListener('change', e => { S.grid = e.target.checked; draw(); });
$('fillToggle').addEventListener('change', e => { S.filled = e.target.checked; });

/* ============================== files ============================== */
function toText(trim = true) {
  const out = [];
  for (let y = 0; y < H; y++) {
    let line = '';
    for (let x = 0; x < W; x++) line += chars[idx(x, y)] || ' ';
    out.push(trim ? line.replace(/\s+$/, '') : line);
  }
  return out.join('\n');
}
function toANSI() {
  const out = [];
  for (let y = 0; y < H; y++) {
    let line = '', cur = null;
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const col = (S.useColor ? colors[i] : null) || INK;
      if (col !== cur) { line += `\x1b[38;2;${hexToRgb(col).join(';')}m`; cur = col; }
      line += chars[i] || ' ';
    }
    line = line.replace(/\s+$/, '');
    out.push(line ? line + '\x1b[0m' : '');
  }
  return out.join('\n');
}
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function download(name, content, type = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1300);
}

$('txtBtn').addEventListener('click', async () => {
  const text = toText();
  try {
    await navigator.clipboard.writeText(text);
    toast('copied to clipboard');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('copied');
  }
});
$('ansBtn').addEventListener('click', () => { download('art.ans', toANSI()); toast('art.ans saved'); });
$('saveBtn').addEventListener('click', () => {
  const data = {
    app: 'ascii-studio', version: 1, w: W, h: H,
    rows: toText(false).split('\n'),
    colors: Array.from({ length: H }, (_, y) =>
      Array.from({ length: W }, (_, x) => colors[idx(x, y)] || null)),
    fontSize, useColor: S.useColor
  };
  download('art.json', JSON.stringify(data), 'application/json');
  toast('project saved');
});
$('pngBtn').addEventListener('click', () => {
  const scale = 2;
  const off = document.createElement('canvas');
  const cw = cellW * scale, chh = cellH * scale;
  const dpr = 1;
  off.width = Math.ceil(W * cw) + PAD * 2 * scale;
  off.height = H * chh + PAD * 2 * scale;
  const g = off.getContext('2d');
  render(g, { grid: false, preview: null, scale, cw, chh, pad: PAD * scale, bg: '#0b0d11' });
  off.toBlob(b => { download('art.png', b, 'image/png'); toast('art.png saved'); });
});
$('newBtn').addEventListener('click', () => {
  if (!confirm('Clear the canvas?')) return;
  pushHistory();
  chars = new Array(W * H).fill(' ');
  colors = new Array(W * H).fill(null);
  draw(); toast('cleared');
});

let pendingMode = 'txt';
$('importBtn').addEventListener('click', () => { pendingMode = 'txt'; $('fileInput').click(); });
$('loadBtn').addEventListener('click', () => { pendingMode = 'json'; $('fileInput').click(); });
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      if (pendingMode === 'json') loadJSON(JSON.parse(reader.result));
      else loadText(reader.result);
    } catch (err) { alert('Could not read file: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function loadText(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  const nw = clamp(Math.max(...lines.map(l => l.length), 4), 4, 400);
  const nh = clamp(lines.length, 2, 200);
  pushHistory();
  W = nw; H = nh;
  chars = new Array(W * H).fill(' ');
  colors = new Array(W * H).fill(null);
  lines.forEach((line, y) => {
    for (let x = 0; x < Math.min(line.length, W); x++) chars[idx(x, y)] = line[x];
  });
  cursor = { x: 0, y: 0 }; syncSizeInputs(); layout(); toast(`imported ${W} × ${H}`);
}
function loadJSON(d) {
  const rows = d.rows || (d.chars || '').split('\n');
  const nw = clamp(d.w || Math.max(...rows.map(r => r.length), 4), 4, 400);
  const nh = clamp(d.h || rows.length, 2, 200);
  pushHistory();
  W = nw; H = nh;
  chars = new Array(W * H).fill(' ');
  colors = new Array(W * H).fill(null);
  rows.forEach((line, y) => {
    for (let x = 0; x < Math.min(line.length, W); x++) chars[idx(x, y)] = line[x];
  });
  if (Array.isArray(d.colors))
    d.colors.forEach((row, y) => row && row.forEach((c, x) => { if (c) colors[idx(x, y)] = c; }));
  if (typeof d.fontSize === 'number') { fontSize = d.fontSize; $('zoom').value = fontSize; }
  S.useColor = !!d.useColor; $('useColor').checked = S.useColor;
  cursor = { x: 0, y: 0 }; syncSizeInputs(); layout(); toast('project loaded');
}

/* ============================== sample ============================== */
const SAMPLE = [
  "",
  "",
  "      __  ____________  __  ______________",
  "     / / / / ____/ __ \\/  |/  / ____/ ___/",
  "    / /_/ / __/ / /_/ / /|_/ / __/  \\__ \\",
  "   / __  / /___/ _, _/ /  / / /___ ___/ /",
  "  /_/ /_/_____/_/ |_/_/  /_/_____//____/",
  "",
  "     /\\_/\\   +----------------------------------------+",
  "    ( o.o )  |  click a cell, then just start typing  |",
  "     > ^ <   |  shapes: line / rect / ellipse / fill  |",
  "              +----------------------------------------+",
  "",
  "  1-8 tools   .   ctrl+z undo   .   drag to draw",
];
$('sampleBtn').addEventListener('click', () => {
  pushHistory();
  const nw = Math.max(80, ...SAMPLE.map(l => l.length + 8));
  W = nw; H = 30;
  chars = new Array(W * H).fill(' ');
  colors = new Array(W * H).fill(null);
  SAMPLE.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) if (line[x] !== ' ') chars[idx(x + 2, y + 1)] = line[x];
  });
  cursor = { x: 0, y: 0 }; syncSizeInputs(); layout(); toast('sample loaded');
});

/* ============================== boot ============================== */
function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('w')) $('gridW').value = params.get('w');
  if (params.get('h')) $('gridH').value = params.get('h');
  if (params.has('w') || params.has('h')) {
    W = clamp(parseInt($('gridW').value) || 80, 4, 400);
    H = clamp(parseInt($('gridH').value) || 30, 2, 200);
    chars = new Array(W * H).fill(' ');
    colors = new Array(W * H).fill(null);
  }
  fontSize = parseInt($('zoom').value);
  syncCharInput(); syncColorUI(); setTool('pencil'); syncSizeInputs();
  if (restore()) { undoStack.length = 0; redoStack.length = 0; }
  else { setTimeout(() => { $('sampleBtn').click(); undoStack.length = 0; }, 60); }
  layout();
  requestAnimationFrame(() => { layout(); });
}
window.addEventListener('resize', layout);
boot();

/* expose a tiny API for automation/tests */
window.ASCII = {
  get state() { return { W, H, tool: S.tool, ch: S.ch, hasColor: S.useColor }; },
  setCell, paint, flood, toText, toANSI, loadText, loadJSON,
  undo, redo, setTool, draw,
  setSize(w, h) { $('gridW').value = w; $('gridH').value = h; $('resizeBtn').click(); }
};
})();
</script>
</body>
